AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Deploy the fastapi-dynamodb-sample container to AWS Lambda via AWS SAM.

Parameters:
  ProxyUrl:
    Type: String
    Default: ""
    Description: Proxy URL for Docker build

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoAuthorizer

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # スタック名を含めることで、複数デプロイ時のテーブル名競合を回避
      # 例: fastapi-dev-alice-items, fastapi-dev-bob-items
      TableName: !Sub '${AWS::StackName}-items'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-client'
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
      Environment:
        Variables:
          DYNAMODB_ITEMS_TABLE_NAME: !Ref ItemsTable
          LOG_LEVEL: DEBUG
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: fastapi-dynamodb-sample
      DockerBuildArgs:
        HTTP_PROXY: !Ref ProxyUrl
        HTTPS_PROXY: !Ref ProxyUrl

Outputs:
  ApiEndpoint:
    Description: Invoke URL for the deployed FastAPI service
    Value: !GetAtt HttpApi.ApiEndpoint

  LambdaFunctionName:
    Description: Name of the deployed Lambda function
    Value: !Ref FastApiFunction

  ItemsTableName:
    Description: DynamoDB table backing the service
    Value: !Ref ItemsTable

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn
